<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Feedback Board</title>
    <link rel="stylesheet" href="/static/css/feedback.css">
</head>
<body>
    <div class="container">
        
        <div id="notification" class="notification"></div>

        <ul>
            {% for issue in issues %}
            <li style="list-style: none; margin-bottom: 3rem;">
                
                <div class="issue-header">
                    <div class="issue-meta">
                        <span class="badge badge-open">OPEN</span>
                        <span class="issue-number">#{{ forloop.counter }}</span>
                    </div>

                    <h1>{{ issue.title }}</h1>

                    <p class="issue-description">
                        {{ issue.description }}
                    </p>

                    <div class="issue-footer">
                        <span>Created by <strong>{{ issue.issued_by }}</strong></span>
                        <span style="margin-left: auto;"></span>
                    </div>
                </div>

                <div class="comments-header" data-issu_slug="{{ issue.slug }}">
                    <h2 class="comments-section-title">Feedbacks</h2>
                    <button class="toggle-btn" 
                            id="toggleCommentBtn-{{ issue.slug }}" 
                            onclick="toggleCommentSection('{{ issue.slug }}')">Show Feedbacks</button>
                </div>

                <div class="comment-thread collapsed" id="commentThread-{{ issue.slug }}" data-issu_slug="{{ issue.slug }}">
                    <div id="commentsArea-{{ issue.slug }}">
                        </div>
                </div>

                <div class="add-comment collapsed" id="addComment-{{ issue.slug }}">
                    <h3 class="add-comment-title">Add a Feedback</h3>
                    <textarea id="mainCommentInput-{{ issue.slug }}" placeholder="Write a comment..."></textarea>
                    <div class="comment-actions-main">
                        <button class="btn-secondary" onclick="cancelMainComment('{{ issue.slug }}')">Cancel</button>
                        <button class="btn-primary" onclick="submitMainComment('{{ issue.slug }}')">Post Feedback</button>
                    </div>
                </div>

            </li>
            {% endfor %}
        </ul>
    </div>

    <script src="/static/js/LiveFeedback.js"></script>
</body>
</html>
